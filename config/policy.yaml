# Routing policy. Data, not code: reloaded with POST /v1/policy/reload and
# rolled back by restoring the previous version of this file.
#
# Admission runs before scoring. A candidate that fails a tenant, residency or
# data-class rule is not a fallback, it is not a route.
#
# A candidate names a pool from config/capacity.yaml, and states the two axes
# that policy reasons about: `compute` (gpu|cpu) and `deployment`
# (onprem|cloud). The client-facing tier is derived, not stored: a cloud
# deployment is `cloud`, anything on-prem is named by its compute. That is what
# lets a tenant allow GPUs while forbidding the perimeter to be left.
#
# GPU costs are 0.0 because the node is owned; CPU and cloud figures come from
# the calibrated profiles in src/tiersim/profiles.py and are MODELLED.
#
# `latency_ms` restates the pool's `slo.expected_latency_ms` from
# config/capacity.yaml so admission can compare one candidate against a tenant's
# latency budget without reading a second file. The deploy validator fails if
# the two ever disagree. Leaving it out means "not declared": such a candidate
# is never vetoed on latency.
version: "2026-11-05.1"

breaker:
  failures: 3
  window_s: 60
  open_s: 20

aliases:
  slm-small:
    description: "Qwen3-4B general assistant: measured GPU, modelled CPU and cloud standbys"
    primary: gpu
    candidates:
      - name: gpu
        compute: gpu
        deployment: onprem
        pool: onprem-gpu
        backend: http://vllm-gpu:8000
        upstream_model: slm-small
        region: onprem
        serves_regions: [eu, us]
        sovereign: true
        priority: 0
        max_context: 8192
        cost_per_1k_out: 0.0
        latency_ms: 900
        model_version: qwen3-4b-awq-2026-02

      - name: cpu
        compute: cpu
        deployment: onprem
        pool: onprem-cpu
        backend: http://tiersim-cpu:8001
        upstream_model: slm-small
        region: onprem
        serves_regions: [eu, us]
        sovereign: true
        priority: 10
        max_context: 4096
        cost_per_1k_out: 0.0088
        latency_ms: 2500
        model_version: qwen3-4b-q4-cpu

      - name: cloud-us
        compute: gpu
        deployment: cloud
        pool: cloud-burst
        backend: http://tiersim-cloud:8001
        upstream_model: slm-small
        region: us-east
        serves_regions: [us]
        sovereign: false
        priority: 5
        max_context: 8192
        cost_per_1k_out: 0.00033
        latency_ms: 1500
        model_version: qwen3-4b-awq-cloud

  # Direct alias for callers that want the CPU tier regardless of GPU health.
  slm-small-cpu:
    description: "Xeon-class CPU tier (MODELLED - calibrated simulator)"
    primary: cpu
    candidates:
      - name: cpu
        compute: cpu
        deployment: onprem
        pool: onprem-cpu
        backend: http://tiersim-cpu:8001
        upstream_model: slm-small
        region: onprem
        serves_regions: [eu, us]
        sovereign: true
        priority: 10
        max_context: 4096
        cost_per_1k_out: 0.0088
        latency_ms: 2500
        model_version: qwen3-4b-q4-cpu

  # Release canary. v1 is the primary; v2 receives a deterministic slice of
  # traffic, sticky per tenant, so one tenant never flips between versions.
  # Pinning percent to 0 is a rollback; raising it is a promotion.
  slm-triage:
    description: "QLoRA triage adapter: v1 primary, v2 canary at 50% (sticky per tenant)"
    primary: v1
    canary:
      candidate: v2
      percent: 50
      sticky: tenant
    shadow:
      candidate: v2
      percent: 5
      max_tokens: 64
    candidates:
      - name: v1
        compute: gpu
        deployment: onprem
        pool: onprem-gpu
        backend: http://vllm-gpu:8000
        upstream_model: triage-v1
        region: onprem
        serves_regions: [eu, us]
        sovereign: true
        priority: 0
        max_context: 8192
        cost_per_1k_out: 0.0
        latency_ms: 900
        model_version: triage-v1

      - name: v2
        compute: gpu
        deployment: onprem
        pool: onprem-gpu
        backend: http://vllm-gpu:8000
        upstream_model: triage-v2
        region: onprem
        serves_regions: [eu, us]
        sovereign: true
        priority: 1
        max_context: 8192
        cost_per_1k_out: 0.0
        latency_ms: 900
        model_version: triage-v2

  # Pinned alias for callers and evals that must not receive canary traffic.
  slm-triage-v2:
    description: "QLoRA triage adapter v2, pinned (opt-in)"
    primary: v2
    candidates:
      - name: v2
        compute: gpu
        deployment: onprem
        pool: onprem-gpu
        backend: http://vllm-gpu:8000
        upstream_model: triage-v2
        region: onprem
        serves_regions: [eu, us]
        sovereign: true
        priority: 0
        max_context: 8192
        cost_per_1k_out: 0.0
        latency_ms: 900
        model_version: triage-v2
