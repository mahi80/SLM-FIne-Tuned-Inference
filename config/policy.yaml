# Routing policy. Data, not code: reloaded with POST /v1/policy/reload and
# rolled back by restoring the previous version of this file.
#
# Admission runs before scoring. A candidate that fails a tenant, residency or
# data-class rule is not a fallback, it is not a route.
#
# GPU costs are 0.0 because the node is owned; CPU and cloud figures come from
# the calibrated profiles in src/tiersim/profiles.py and are MODELLED.
version: "2026-11-04.1"

breaker:
  failures: 3
  window_s: 60
  open_s: 20

aliases:
  slm-small:
    description: "Qwen3-4B general assistant: measured GPU, modelled CPU and cloud standbys"
    primary: gpu
    candidates:
      - name: gpu
        tier: gpu
        backend: http://vllm-gpu:8000
        upstream_model: slm-small
        region: onprem
        serves_regions: [eu, us]
        sovereign: true
        priority: 0
        max_context: 8192
        cost_per_1k_out: 0.0
        model_version: qwen3-4b-awq-2026-02

      - name: cpu
        tier: cpu
        backend: http://tiersim-cpu:8001
        upstream_model: slm-small
        region: onprem
        serves_regions: [eu, us]
        sovereign: true
        priority: 10
        max_context: 4096
        cost_per_1k_out: 0.0088
        model_version: qwen3-4b-q4-cpu

      - name: cloud-us
        tier: cloud
        backend: http://tiersim-cloud:8001
        upstream_model: slm-small
        region: us-east
        serves_regions: [us]
        sovereign: false
        priority: 5
        max_context: 8192
        cost_per_1k_out: 0.00033
        model_version: qwen3-4b-awq-cloud

  # Direct alias for callers that want the CPU tier regardless of GPU health.
  slm-small-cpu:
    description: "Xeon-class CPU tier (MODELLED - calibrated simulator)"
    primary: cpu
    candidates:
      - name: cpu
        tier: cpu
        backend: http://tiersim-cpu:8001
        upstream_model: slm-small
        region: onprem
        serves_regions: [eu, us]
        sovereign: true
        priority: 10
        max_context: 4096
        cost_per_1k_out: 0.0088
        model_version: qwen3-4b-q4-cpu

  # Release canary. v1 is the primary; v2 receives a deterministic slice of
  # traffic, sticky per tenant, so one tenant never flips between versions.
  # Pinning percent to 0 is a rollback; raising it is a promotion.
  slm-triage:
    description: "QLoRA triage adapter: v1 primary, v2 canary at 50% (sticky per tenant)"
    primary: v1
    canary:
      candidate: v2
      percent: 50
      sticky: tenant
    shadow:
      candidate: v2
      percent: 5
      max_tokens: 64
    candidates:
      - name: v1
        tier: gpu
        backend: http://vllm-gpu:8000
        upstream_model: triage-v1
        region: onprem
        serves_regions: [eu, us]
        sovereign: true
        priority: 0
        max_context: 8192
        cost_per_1k_out: 0.0
        model_version: triage-v1

      - name: v2
        tier: gpu
        backend: http://vllm-gpu:8000
        upstream_model: triage-v2
        region: onprem
        serves_regions: [eu, us]
        sovereign: true
        priority: 1
        max_context: 8192
        cost_per_1k_out: 0.0
        model_version: triage-v2

  # Pinned alias for callers and evals that must not receive canary traffic.
  slm-triage-v2:
    description: "QLoRA triage adapter v2, pinned (opt-in)"
    primary: v2
    candidates:
      - name: v2
        tier: gpu
        backend: http://vllm-gpu:8000
        upstream_model: triage-v2
        region: onprem
        serves_regions: [eu, us]
        sovereign: true
        priority: 0
        max_context: 8192
        cost_per_1k_out: 0.0
        model_version: triage-v2
