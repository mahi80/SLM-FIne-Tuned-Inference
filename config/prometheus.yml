global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8000"]

  - job_name: tiersim
    static_configs:
      - targets: ["tiersim-cpu:8001"]

  - job_name: vllm
    static_configs:
      - targets: ["vllm-gpu:8000"]
