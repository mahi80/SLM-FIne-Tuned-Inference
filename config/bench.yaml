# Benchmark matrix. Every target speaks the same OpenAI contract, so the only
# difference the numbers can show is the tier (or the adapter) behind it.
#
# Modelled targets are labelled MODELLED in the report from their x-simulated
# header, not from this file.
version: "2026-11-04.1"

prompt: >-
  A maintenance engineer asks why vibration monitoring matters on an industrial
  pump. Answer in plain language, four or five sentences, without a list.
max_tokens: 64
stream: true
warmup: 2
concurrency: [1, 4, 12]
requests: 20

targets:
  - label: gpu-direct
    base_url: http://localhost:8010
    model: slm-small

  - label: adapter-v2
    base_url: http://localhost:8020
    model: slm-triage-v2
    api_key: dev-acme-key

  - label: cloud-sim
    base_url: http://localhost:8012
    model: slm-small

  - label: cpu-sim
    base_url: http://localhost:8011
    model: slm-small
    requests: 8

# Prefix-cache probe (`make bench-prefix`). Runs each target twice at c=1 with
# this system prompt: once unchanged, so every request after the warm-up reuses
# its KV blocks, and once with a random nonce at the very start, so no block
# can be reused. The TTFT difference is the prefill work prefix caching saves.
# vLLM hashes KV blocks from the first token, which is why the nonce goes first.
prefix_probe:
  targets: [gpu-direct, adapter-v2]
  concurrency: 1
  requests: 10
  warmup: 1
  max_tokens: 16
  system_prompt: >-
    You are the maintenance assistant for a plant that runs centrifugal pumps,
    gearboxes, compressors and conveyor drives. Answer for a technician on the
    floor, not for an engineer writing a report. Use plain language and keep to
    the question. When a question is about a fault, give the most likely cause
    first, then the next check that would confirm or rule it out, and say what
    reading or observation would change your answer. Units are metric:
    millimetres per second RMS for vibration velocity, degrees Celsius for
    bearing and casing temperature, bar for pressure and amperes for motor
    current. Refer to ISO 10816-3 zones when vibration severity matters: zone A
    is new-machine condition, zone B is acceptable for long-term running, zone C
    is acceptable only for a limited period until a planned stop, and zone D is
    severe enough to cause damage. Never tell a technician to bypass a guard, an
    interlock or a lock-out tag, and never suggest work on an energised machine.
    If the question needs a permit, an isolation or a second person, say so
    before giving any steps. If you do not know, say that you do not know and
    name who would: the reliability engineer for trends, the OEM for warranty
    questions and the shift supervisor for anything that stops production.
    Keep answers short enough to read on a handheld screen.
