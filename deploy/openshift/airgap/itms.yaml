# Tag resolution for manifests that reference a tag rather than a digest.
# IDMS covers the digest path; ITMS covers the tag path when the upstream
# registry is unreachable.
apiVersion: config.openshift.io/v1
kind: ImageTagMirrorSet
metadata:
  name: slm-fabric
spec:
  imageTagMirrors:
    - source: docker.io/vllm/vllm-openai
      mirrors: [mirror.internal.example/vllm/vllm-openai]
      mirrorSourcePolicy: NeverContactSource
    - source: ghcr.io/mahi80/slm-gateway
      mirrors: [mirror.internal.example/ghcr.io/mahi80/slm-gateway]
      mirrorSourcePolicy: NeverContactSource
    - source: ghcr.io/mahi80/slm-tiersim
      mirrors: [mirror.internal.example/ghcr.io/mahi80/slm-tiersim]
      mirrorSourcePolicy: NeverContactSource
    - source: ghcr.io/mahi80/slm-eval
      mirrors: [mirror.internal.example/ghcr.io/mahi80/slm-eval]
      mirrorSourcePolicy: NeverContactSource
