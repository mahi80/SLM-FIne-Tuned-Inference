apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: slm-fabric
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Private SLM serving fabric - application, admission policy and mirror config
  sourceRepos:
    - https://github.com/mahi80/SLM-FIne-Tuned-Inference.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: slm-fabric
    - server: https://kubernetes.default.svc
      namespace: argocd
  # Cluster-scoped objects this project is allowed to create. The mirror sets
  # are listed so an air-gapped install can be driven from the same repository;
  # they are applied by a cluster admin, not by the default app set.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: kyverno.io
      kind: ClusterPolicy
    - group: config.openshift.io
      kind: ImageDigestMirrorSet
    - group: config.openshift.io
      kind: ImageTagMirrorSet
  # Tenant API keys are created out of band and must never be a Git artifact.
  # Blacklisting Secret makes an accidental commit fail the sync instead of
  # overwriting the live credential.
  namespaceResourceBlacklist:
    - group: ""
      kind: Secret
  orphanedResources:
    warn: true
