# Admission policy before workloads: a pod that this app rejects must never be
# created by the platform app in the first place.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slm-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: slm-fabric
  source:
    repoURL: https://github.com/mahi80/SLM-FIne-Tuned-Inference.git
    targetRevision: main
    path: deploy/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: slm-fabric
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
