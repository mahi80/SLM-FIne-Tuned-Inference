# The serving stack. Switch `path` to overlays/airgap for a disconnected
# install; everything else in this file stays the same.
#
# The kustomization reads config/policy.yaml from outside its own tree, so the
# build needs --load-restrictor LoadRestrictionsNone. Argo CD v3 removed
# spec.source.kustomize.buildOptions, so set it once for the whole repo:
#
#   kubectl -n argocd patch configmap argocd-cm --type merge -p \
#     '{"data":{"kustomize.buildOptions":"--load-restrictor LoadRestrictionsNone"}}'
#
# then restart argocd-repo-server.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slm-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: slm-fabric
  source:
    repoURL: https://github.com/mahi80/SLM-FIne-Tuned-Inference.git
    targetRevision: main
    path: deploy/kustomize/overlays/openshift
  destination:
    server: https://kubernetes.default.svc
    namespace: slm-fabric
  # KEDA's HPA owns the GPU tier's replica count. Without this, selfHeal would
  # write the manifest value back on every sync and undo every scale event.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: vllm-gpu
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The ServiceMonitor CRD may be installed by an operator in the same
      # cluster; do not fail the dry run before it exists.
      - SkipDryRunOnMissingResource=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 10m
