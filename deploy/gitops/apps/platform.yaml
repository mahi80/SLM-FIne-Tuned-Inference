# The serving stack. Switch `path` to overlays/airgap for a disconnected
# install; everything else in this file stays the same.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slm-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: slm-fabric
  source:
    repoURL: https://github.com/mahi80/SLM-FIne-Tuned-Inference.git
    targetRevision: main
    path: deploy/kustomize/overlays/openshift
    kustomize:
      # policy.yaml is generated from config/policy.yaml at the repository
      # root, so the kustomization deliberately reaches outside its own tree.
      buildOptions: --load-restrictor LoadRestrictionsNone
  destination:
    server: https://kubernetes.default.svc
    namespace: slm-fabric
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The ServiceMonitor CRD may be installed by an operator in the same
      # cluster; do not fail the dry run before it exists.
      - SkipDryRunOnMissingResource=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 10m
