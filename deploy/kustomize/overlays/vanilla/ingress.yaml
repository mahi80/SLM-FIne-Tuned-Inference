apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: slm-gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: slm-fabric
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    # Streaming completions outlive the default 60s proxy read timeout.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # SSE must not be buffered, or TTFT becomes the full generation time.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [slm.example.internal]
      secretName: slm-tls
  rules:
    - host: slm.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8000
