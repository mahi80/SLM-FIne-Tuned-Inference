apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: slm-fabric

resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - vllm/pvc.yaml
  - vllm/deployment.yaml
  - vllm/service.yaml
  - gateway/pvc.yaml
  - gateway/deployment.yaml
  - gateway/service.yaml
  - tiersim/cpu-deployment.yaml
  - tiersim/cpu-service.yaml
  - tiersim/cloud-deployment.yaml
  - tiersim/cloud-service.yaml
  - networkpolicies.yaml

# The canonical routing policy stays at config/policy.yaml so the compose path
# and the cluster path cannot drift. Rendering therefore needs:
#   kubectl kustomize --load-restrictor LoadRestrictionsNone <overlay>
# The generated name carries a content hash, so a policy edit rolls the
# gateway instead of leaving it on stale data.
configMapGenerator:
  - name: slm-policy
    files:
      - policy.yaml=../../../config/policy.yaml
    options:
      labels:
        app.kubernetes.io/part-of: slm-fabric

images:
  - name: vllm/vllm-openai
    newTag: v0.33.0
  - name: slm/gateway
    newTag: "0.5.0"
  - name: slm/tiersim
    newTag: "0.5.0"

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
