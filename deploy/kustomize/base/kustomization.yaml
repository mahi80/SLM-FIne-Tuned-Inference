apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: slm-fabric

resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - vllm/pvc.yaml
  - vllm/deployment.yaml
  - vllm/service.yaml
  - gateway/pvc.yaml
  - gateway/deployment.yaml
  - gateway/service.yaml
  - tiersim/cpu-deployment.yaml
  - tiersim/cpu-service.yaml
  - tiersim/cloud-deployment.yaml
  - tiersim/cloud-service.yaml
  - networkpolicies.yaml

# The canonical routing policy stays at config/policy.yaml so the compose path
# and the cluster path cannot drift. Rendering therefore needs:
#   kubectl kustomize --load-restrictor LoadRestrictionsNone <overlay>
# The generated name carries a content hash, so a policy edit rolls the
# gateway instead of leaving it on stale data.
configMapGenerator:
  - name: slm-policy
    files:
      - policy.yaml=../../../config/policy.yaml
    options:
      labels:
        app.kubernetes.io/part-of: slm-fabric

# Digests, not tags, are what the cluster runs. The tag stays for humans and
# because a digest alone gives no clue which release a pod is on; the validator
# and the signed manifest check both. First-party images are published from
# this repository, and their digests are minted by the images workflow.
images:
  - name: vllm/vllm-openai
    newTag: v0.33.0
    digest: sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
  - name: slm/gateway
    newName: ghcr.io/mahi80/slm-gateway
    newTag: "0.5.0"
    digest: sha256:9032483f7032dfa0d4cf7a5919e761fabd954523ac6f8672b60deb2dda209d8c
  - name: slm/tiersim
    newName: ghcr.io/mahi80/slm-tiersim
    newTag: "0.5.0"
    digest: sha256:d1e3b535c8cc1b2f964b655fa9f74b6f93690c97d3e0debf0f59dcac6880ccb4

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
