apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: slm-fabric
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  # Exactly one, deliberately. Rate-limit counters, circuit-breaker state and
  # the audit chain are in-process. A second replica would partition tenant
  # quotas and interleave two writers into one audit file. Scaling out requires
  # moving that state to Redis/Postgres first (see ADR-0006).
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: control-plane
        app.kubernetes.io/part-of: slm-fabric
    spec:
      serviceAccountName: slm-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: slm/gateway
          imagePullPolicy: IfNotPresent
          env:
            - name: POLICY_FILE
              value: /app/config/policy.yaml
            - name: TENANTS_FILE
              value: /app/secrets/tenants.yaml
            - name: AUDIT_FILE
              value: /var/lib/slm/audit.jsonl
            # External backends read their bearer keys from this file. The
            # Secret is optional: an in-cluster-only install has no cloud keys,
            # and the gateway vetoes external candidates as unconfigured.
            - name: SLM_BACKEND_KEYS
              value: /app/backend-keys/keys.yaml
            - name: SLM_PROBE_INTERVAL_S
              value: "30"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            # policy.yaml is generated from config/policy.yaml; the hash suffix
            # changes the pod template, so a policy edit rolls the gateway.
            - name: policy
              mountPath: /app/config
            # Tenant keys are not in Git. The Secret is created out of band.
            # It gets its own directory: a subPath mount nested inside the
            # read-only ConfigMap mount fails at container start ("not a
            # directory") because the kubelet cannot create the bind target.
            - name: tenants
              mountPath: /app/secrets
              readOnly: true
            # Not in Git. Created out of band by whoever owns the cloud
            # account; optional so an on-prem-only install starts without it.
            - name: backend-keys
              mountPath: /app/backend-keys
              readOnly: true
            - name: audit
              mountPath: /var/lib/slm
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: policy
          configMap:
            name: slm-policy
        - name: tenants
          secret:
            secretName: slm-tenants
            optional: false
        - name: backend-keys
          secret:
            secretName: slm-backend-keys
            optional: true
        - name: audit
          persistentVolumeClaim:
            claimName: slm-gateway-audit
        - name: tmp
          emptyDir: {}
