# The workloads never call the Kubernetes API. Tokens are not mounted, so a
# compromised container has nothing to replay against the control plane.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: slm-gateway
  labels:
    app.kubernetes.io/part-of: slm-fabric
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: slm-vllm
  labels:
    app.kubernetes.io/part-of: slm-fabric
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: slm-tiersim
  labels:
    app.kubernetes.io/part-of: slm-fabric
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: false
---
# Hooks and one-shot jobs (adapter load, release gate).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: slm-ops
  labels:
    app.kubernetes.io/part-of: slm-fabric
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: false
