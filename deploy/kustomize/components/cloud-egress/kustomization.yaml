apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Opt in only when config/policy.yaml routes to an external pool. The validator
# refuses the combination in either direction: external candidates without this
# component, or this component with no external candidate.
#
# Prerequisites created out of band, never committed:
#   Secret/slm-backend-keys   keys.yaml with `keys: {name: secret}` matching the
#                             `access.key` of every external candidate
#   ConfigMap/slm-backend-ca  optional CA bundle for providers whose chain is
#                             not in the image; mount it and set SLM_BACKEND_CA
resources:
  - networkpolicy.yaml
