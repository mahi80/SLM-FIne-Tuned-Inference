apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Two PostSync hooks run on every platform sync, in weight order:
#
#   -5  adapter-loader  promote triage-v1/v2 into the running vLLM
#    5  release-gate    score triage-v2 against the golden set and fail the
#                       sync if the floors in config/eval-gates.yaml are missed
#
# The gate runs against vLLM directly, not the gateway: it measures the model,
# not the router, and needs no tenant credential. Model promotion through the
# gateway is controlled separately by the canary percentage in policy.yaml.
resources:
  - adapter-loader.yaml
  - release-gate-job.yaml
  - networkpolicy.yaml

images:
  - name: slm/eval
    newName: ghcr.io/mahi80/slm-eval
    newTag: "0.5.0"
    digest: sha256:137d10b44f2d235ef74e3d6f4797c09ea9f56ca7baeab92eda991262b30b7fd4
  # The adapter loader reuses the gateway image for its stdlib-only client.
  # Component resources are transformed after the base, so this entry has to
  # repeat the pin the base applies to the deployments.
  - name: slm/gateway
    newName: ghcr.io/mahi80/slm-gateway
    newTag: "0.5.0"
    digest: sha256:16759fe6fd4febc6d88509283cfe34f69fd29d3eaf0b3671911cf1a6f587ebdf
