# The in-cluster half of the release gate. The authoritative gate runs in CI
# (`make eval-gate`) before a manifest revision is merged; this hook re-checks
# the deployed adapter so a bad promotion cannot stay Synced.
apiVersion: batch/v1
kind: Job
metadata:
  name: release-gate
  labels:
    app.kubernetes.io/name: release-gate
    app.kubernetes.io/part-of: slm-fabric
    slm.fabric/role: ops-job
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-weight: "5"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: release-gate
        app.kubernetes.io/part-of: slm-fabric
        slm.fabric/role: ops-job
    spec:
      serviceAccountName: slm-ops
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gate
          image: slm/eval
          imagePullPolicy: IfNotPresent
          args:
            - --base-url
            - http://vllm-gpu:8000
            - --model
            - triage-v2
            - --golden
            - /app/src/eval/golden.jsonl
            - --gates
            - /app/config/eval-gates.yaml
            - --concurrency
            - "4"
            - --out
            - /tmp/eval-gate.json
          env:
            - name: PYTHONPATH
              value: /app/src:/app
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
