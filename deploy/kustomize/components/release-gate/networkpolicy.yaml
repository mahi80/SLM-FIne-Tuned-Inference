apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ops-job-egress
  labels:
    app.kubernetes.io/part-of: slm-fabric
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  podSelector:
    matchLabels:
      slm.fabric/role: ops-job
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vllm-gpu
      ports:
        - protocol: TCP
          port: 8000
