# The declared adapter set. This is a release input, not a discovery result:
# a GitOps sync promotes exactly these names, and an absent directory is a
# failed sync rather than a silently missing model.
apiVersion: v1
kind: ConfigMap
metadata:
  name: slm-adapter-set
  labels:
    app.kubernetes.io/part-of: slm-fabric
data:
  adapters.txt: |
    triage-v1
    triage-v2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: slm-adapter-loader
  labels:
    app.kubernetes.io/part-of: slm-fabric
data:
  load_adapters.py: |
    """Load the declared adapters into the running vLLM server.

    Runs as a PostSync hook. vLLM is started with --enable-lora and runtime
    updating enabled, so promotion and rollback do not restart the GPU tier.
    """
    import json
    import os
    import sys
    import time
    import urllib.error
    import urllib.request

    BASE = os.environ.get("VLLM_URL", "http://vllm-gpu:8000")
    DEADLINE = time.time() + int(os.environ.get("LOAD_TIMEOUT_S", "900"))


    def post(path, body):
        request = urllib.request.Request(
            BASE + path,
            data=json.dumps(body).encode(),
            headers={"content-type": "application/json"},
            method="POST",
        )
        try:
            with urllib.request.urlopen(request, timeout=180) as response:
                return response.status, response.read().decode()
        except urllib.error.HTTPError as exc:
            return exc.code, exc.read().decode()


    def names():
        with open("/etc/slm/adapters/adapters.txt", encoding="utf-8") as handle:
            return [line.strip() for line in handle if line.strip() and not line.startswith("#")]


    failed = False
    for name in names():
        while True:
            status, text = post(
                "/v1/load_lora_adapter",
                {"lora_name": name, "lora_path": "/adapters/" + name},
            )
            if status == 200 or "already" in text.lower():
                print(name + ": loaded", flush=True)
                break
            if time.time() > DEADLINE:
                print(name + ": FAILED " + str(status) + " " + text[:300], flush=True)
                failed = True
                break
            time.sleep(10)

    sys.exit(1 if failed else 0)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: adapter-loader
  labels:
    app.kubernetes.io/name: adapter-loader
    app.kubernetes.io/part-of: slm-fabric
    slm.fabric/role: ops-job
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-weight: "-5"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adapter-loader
        app.kubernetes.io/part-of: slm-fabric
        slm.fabric/role: ops-job
    spec:
      serviceAccountName: slm-ops
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loader
          image: slm/gateway
          imagePullPolicy: IfNotPresent
          command: ["python", "-B", "/opt/slm/load_adapters.py"]
          env:
            - name: VLLM_URL
              value: http://vllm-gpu:8000
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: script
              mountPath: /opt/slm
              readOnly: true
            - name: adapters
              mountPath: /etc/slm/adapters
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: slm-adapter-loader
        - name: adapters
          configMap:
            name: slm-adapter-set
