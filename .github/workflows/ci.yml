name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: tests and release gates
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # fastapi + prometheus-client let the gateway integration tests run
        # the real app (semantic cache) instead of skipping.
        run: pip install pyyaml==6.0.3 httpx==0.28.1 fastapi==0.162.0 prometheus-client==0.26.0

      # Rendering the overlays is the only reason this job needs kubectl.
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Deployment validation
        run: python tools/validate_deploy.py

      - name: Fleet inventory
        run: python tools/fleet_status.py --check

      - name: Signed release matches the deployment tree
        run: python -m tools.validate_release

      - name: Release signature
        run: python -m registry verify
