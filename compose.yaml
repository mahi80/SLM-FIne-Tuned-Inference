name: slm-fabric

x-vllm: &vllm
  image: vllm/vllm-openai:${VLLM_TAG:-v0.33.0}
  restart: unless-stopped
  environment:
    HF_HOME: /root/.cache/huggingface
    HF_TOKEN: ${HF_TOKEN:-}
  volumes:
    - hf-cache:/root/.cache/huggingface
  healthcheck:
    test:
      - CMD
      - python3
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
    interval: 20s
    timeout: 5s
    retries: 30
    start_period: 600s

services:
  # GPU tier. Pinned runtime + pinned model revision: a serving node is a
  # reproducible artifact, not a "latest" tag.
  vllm-gpu:
    <<: *vllm
    ports:
      - "${VLLM_PORT:-8010}:8000"
    command:
      # Positional model argument: the `--model` flag is deprecated in `vllm serve`.
      - ${MODEL_ID:-cyankiwi/Qwen3-4B-Instruct-2507-AWQ-4bit}
      - --revision
      - ${MODEL_REVISION:-b37d1ccb77e27a70fe4222d995fda27940eead5a}
      - --served-model-name
      - ${SERVED_MODEL_NAME:-slm-small}
      - --dtype
      - float16
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "16"
      - --gpu-memory-utilization
      - "0.85"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf-cache:
