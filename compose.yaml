name: slm-fabric

x-vllm: &vllm
  image: vllm/vllm-openai:${VLLM_TAG:-v0.33.0}
  restart: unless-stopped
  environment:
    HF_HOME: /root/.cache/huggingface
    HF_TOKEN: ${HF_TOKEN:-}
    # Allows POST /v1/load_lora_adapter and /v1/unload_lora_adapter at runtime,
    # so a model release can be promoted or rolled back without a restart.
    VLLM_ALLOW_RUNTIME_LORA_UPDATING: "1"
  volumes:
    - hf-cache:/root/.cache/huggingface
    - ./adapters:/adapters:ro
  healthcheck:
    test:
      - CMD
      - python3
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
    interval: 20s
    timeout: 5s
    retries: 30
    start_period: 600s

services:
  # GPU tier. Pinned runtime + pinned model revision: a serving node is a
  # reproducible artifact, not a "latest" tag.
  vllm-gpu:
    <<: *vllm
    ports:
      - "${VLLM_PORT:-8010}:8000"
    command:
      # Positional model argument: the `--model` flag is deprecated in `vllm serve`.
      - ${MODEL_ID:-cyankiwi/Qwen3-4B-Instruct-2507-AWQ-4bit}
      - --revision
      - ${MODEL_REVISION:-b37d1ccb77e27a70fe4222d995fda27940eead5a}
      - --served-model-name
      - ${SERVED_MODEL_NAME:-slm-small}
      - --dtype
      - float16
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "16"
      - --gpu-memory-utilization
      - "0.85"
      # Multi-LoRA: adapters are served alongside the base as separate model
      # names. Rank 16 matches the QLoRA config in finetune/.
      - --enable-lora
      - --max-lora-rank
      - "16"
      - --max-loras
      - "4"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # CPU tier. Simulated: timing follows a calibrated Xeon profile, output is
  # canned. Every response is tagged x-simulated: true.
  tiersim-cpu:
    build:
      context: .
      dockerfile: docker/tiersim.Dockerfile
    restart: unless-stopped
    environment:
      TIERSIM_PROFILE: ${TIERSIM_PROFILE:-cpu-xeon-4b}
      TIERSIM_MODEL_NAME: ${SERVED_MODEL_NAME:-slm-small}
      TIERSIM_SPEEDUP: ${TIERSIM_SPEEDUP:-1}
    ports:
      - "${TIERSIM_PORT:-8011}:8001"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
      interval: 10s
      timeout: 3s
      retries: 10

  # Modelled cloud tier (single L4 profile). A standby that residency rules
  # usually exclude: this is what makes region admission visible in the audit.
  tiersim-cloud:
    build:
      context: .
      dockerfile: docker/tiersim.Dockerfile
    restart: unless-stopped
    environment:
      TIERSIM_PROFILE: ${TIERSIM_CLOUD_PROFILE:-gpu-l4-4b}
      TIERSIM_MODEL_NAME: ${SERVED_MODEL_NAME:-slm-small}
      TIERSIM_SPEEDUP: ${TIERSIM_SPEEDUP:-1}
    ports:
      - "${TIERSIM_CLOUD_PORT:-8012}:8001"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
      interval: 10s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    restart: unless-stopped
    environment:
      POLICY_FILE: /app/config/policy.yaml
      TENANTS_FILE: /app/config/tenants.yaml
      AUDIT_FILE: /var/lib/slm/audit.jsonl
    volumes:
      - ./config:/app/config:ro
      - ./logs:/var/lib/slm
    ports:
      - "${GATEWAY_PORT:-8020}:8000"
    depends_on:
      tiersim-cpu:
        condition: service_healthy
      tiersim-cloud:
        condition: service_healthy
      vllm-gpu:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 3s
      retries: 10

  # One-off QLoRA trainer. Not part of the serving stack: it takes the GPU, so
  # `make adapter-train` stops the GPU tier first. Run with `--profile train`.
  train:
    profiles: ["train"]
    build:
      context: .
      dockerfile: docker/train.Dockerfile
    restart: "no"
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ./adapters:/adapters
      - ./finetune:/app/finetune
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - gateway
      - tiersim-cpu
      - tiersim-cloud

  grafana:
    image: grafana/grafana:13.2.5
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus

volumes:
  hf-cache:
  prom-data:
  grafana-data:
